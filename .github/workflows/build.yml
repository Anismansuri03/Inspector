# GitHub Actions workflow for Inspector v2
# Builds and publishes artifacts automatically

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the release job elevates only what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        # InspectorService is published with -r win-x64 + --no-restore, so its
        # restore must be runtime-aware (-r win-x64) or project.assets.json will
        # lack the net8.0-windows/win-x64 target (NETSDK1047). PublishReadyToRun
        # must be set at restore time too, otherwise the R2R runtime pack is not
        # restored (NETSDK1094). It runs last so the transitively restored
        # Inspector.Common assets also keep that target when publish builds it
        # under --no-restore.
        run: |
          dotnet restore Inspector.Common/Inspector.Common.csproj
          dotnet restore InspectorReport/InspectorReport.csproj
          dotnet restore InspectorService/InspectorService.csproj -r win-x64 -p:PublishReadyToRun=true

      - name: Build Inspector.Common
        run: dotnet build Inspector.Common/Inspector.Common.csproj -c Release --no-restore

      - name: Build InspectorService (publish)
        run: dotnet publish InspectorService/InspectorService.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o InspectorService/bin/publish --no-restore

      - name: Build InspectorReport
        run: dotnet build InspectorReport/InspectorReport.csproj -c Release --no-restore

      - name: Run tests
        shell: powershell
        # The suite targets Pester 3.4 (see tests/Inspector.Tests.ps1 header).
        # Runner images ship both Pester 3.4.0 and 5.9.0; auto-resolution picks
        # 5.9.0, whose Discovery/Run two-phase model makes the suite's top-level
        # helper functions and Describe-body variables invisible during Run
        # (CommandNotFoundException / null-path failures). Pin 3.4.0 to match
        # the suite's documented contract. Pester 3.4 does not set
        # $LASTEXITCODE, so failures are propagated explicitly via FailedCount.
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $r = Invoke-Pester -Script ./tests/Inspector.Tests.ps1 -PassThru
          if ($null -eq $r -or $r.FailedCount -gt 0) { exit 1 }
          exit 0

      - name: Upload InspectorService artifact
        uses: actions/upload-artifact@v7
        with:
          name: InspectorService
          path: InspectorService/bin/publish/

      - name: Upload InspectorReport artifact
        uses: actions/upload-artifact@v7
        with:
          name: InspectorReport
          path: InspectorReport/bin/Release/net8.0-windows/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish InspectorService
        run: dotnet publish InspectorService/InspectorService.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o InspectorService/bin/publish

      - name: Build InspectorReport
        run: dotnet build InspectorReport/InspectorReport.csproj -c Release

      - name: Create release archive
        run: |
          7z a Inspector-v2.zip `
            InspectorService/bin/publish `
            InspectorReport/bin/Release/net8.0-windows `
            Inspector.ps1 `
            Install-Inspector.bat `
            sysmon-config.xml `
            README.md `
            LICENSE

      - name: Generate SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path Inspector-v2.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Inspector-v2.zip" | Out-File -FilePath Inspector-v2.zip.sha256 -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Inspector-v2.zip
            Inspector-v2.zip.sha256
          generate_release_notes: true
